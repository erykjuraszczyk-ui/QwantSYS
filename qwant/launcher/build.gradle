plugins {
    id "com.android.application"
}

android {
    namespace "com.qwant.launcher"
    compileSdk 35

    defaultConfig {
        applicationId "com.qwant.launcher"
        minSdk 26
        targetSdk 33
        versionCode 2
        versionName "0.2.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            applicationIdSuffix ""
            versionNameSuffix "-test"
        }
    }
}
