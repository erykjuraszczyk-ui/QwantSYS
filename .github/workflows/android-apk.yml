name: QwantSYS Launcher 1.0.0 APK

on:
  push:
    branches:
      - qwantSYS-0.1.0-foundation
    paths:
      - "settings.gradle"
      - "build.gradle"
      - "gradle.properties"
      - "qwant/launcher/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android platform
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Build llama.cpp JNI for Android arm64-v8a
        run: |
          set -euo pipefail
          LLAMA_CPP_SHA="4c4a0f0a4246bc36a3724d12238d5624714dcb2f"
          git init llama.cpp
          git -C llama.cpp remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C llama.cpp fetch --depth=1 origin "$LLAMA_CPP_SHA"
          git -C llama.cpp checkout --detach FETCH_HEAD

          ANDROID_NDK="$ANDROID_HOME/ndk/27.2.12479018"
          CMAKE="$ANDROID_HOME/cmake/3.22.1/bin/cmake"
          test -d "$ANDROID_NDK"
          test -x "$CMAKE"

          "$CMAKE" -S qwant/launcher/src/main/cpp -B build/native \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DLLAMA_CPP_SOURCE_DIR="$GITHUB_WORKSPACE/llama.cpp" \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_NATIVE=OFF \
            -DGGML_OPENMP=OFF \
            -DGGML_LLAMAFILE=OFF \
            -DGGML_CPU_KLEIDIAI=ON \
            -DLLAMA_OPENSSL=OFF
          "$CMAKE" --build build/native --target qwant_llama_jni --parallel 2
          test -s build/native/jni/libqwant_llama_jni.so
          file build/native/jni/libqwant_llama_jni.so
          sha256sum build/native/jni/libqwant_llama_jni.so

      - name: Compile, package and sign APK
        run: |
          set -euo pipefail
          SDK_BUILD="$ANDROID_HOME/build-tools/35.0.0"
          ANDROID_JAR="$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$SDK_BUILD/aapt2"
          test -x "$SDK_BUILD/d8"
          test -x "$SDK_BUILD/zipalign"
          test -x "$SDK_BUILD/apksigner"
          test -s "$ANDROID_JAR"

          mkdir -p build/classes build/dex build/generated out
          "$SDK_BUILD/aapt2" compile --dir qwant/launcher/src/main/res -o build/resources.zip
          "$SDK_BUILD/aapt2" link \
            -I "$ANDROID_JAR" \
            --manifest qwant/launcher/src/main/AndroidManifest.xml \
            -R build/resources.zip \
            --auto-add-overlay \
            --java build/generated \
            --min-sdk-version 26 \
            --target-sdk-version 33 \
            --version-code 10 \
            --version-name 1.0.0 \
            -o build/app-unsigned.apk

          mapfile -t JAVA_FILES < <(find qwant/launcher/src/main/java build/generated -name '*.java' -type f | sort)
          javac -source 17 -target 17 -classpath "$ANDROID_JAR" -d build/classes "${JAVA_FILES[@]}"

          mapfile -t CLASS_FILES < <(find build/classes -name '*.class' -type f | sort)
          "$SDK_BUILD/d8" --lib "$ANDROID_JAR" --min-api 26 --output build/dex "${CLASS_FILES[@]}"

          cp build/app-unsigned.apk build/app-with-dex.apk
          (cd build/dex && zip -q -j ../app-with-dex.apk classes.dex)
          mkdir -p build/apk-native/lib/arm64-v8a
          cp build/native/jni/libqwant_llama_jni.so build/apk-native/lib/arm64-v8a/
          (cd build/apk-native && zip -qr ../app-with-dex.apk lib)
          "$SDK_BUILD/zipalign" -f -p 4 build/app-with-dex.apk build/app-aligned.apk

          keytool -genkeypair -v \
            -keystore build/qwant-debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 3650 \
            -dname "CN=Qwant Debug,O=QwantSYS,C=PL"

          "$SDK_BUILD/apksigner" sign \
            --ks build/qwant-debug.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --ks-key-alias androiddebugkey \
            --out out/QwantSYS-REDMAGIC7-Launcher-1.0.0.apk \
            build/app-aligned.apk

          "$SDK_BUILD/apksigner" verify --verbose --print-certs out/QwantSYS-REDMAGIC7-Launcher-1.0.0.apk
          file out/QwantSYS-REDMAGIC7-Launcher-1.0.0.apk
          sha256sum out/QwantSYS-REDMAGIC7-Launcher-1.0.0.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: QwantSYS-REDMAGIC7-Launcher-1.0.0
          path: out/QwantSYS-REDMAGIC7-Launcher-1.0.0.apk
          if-no-files-found: error
          retention-days: 30
