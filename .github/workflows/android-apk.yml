name: Qwant Launcher APK

on:
  push:
    branches:
      - qwantSYS-0.1.0-foundation
    paths:
      - "settings.gradle"
      - "build.gradle"
      - "gradle.properties"
      - "qwant/launcher/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android platform
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build APK
        run: gradle --no-daemon :qwant:launcher:assembleDebug

      - name: Verify APK output
        run: |
          test -s qwant/launcher/build/outputs/apk/debug/launcher-debug.apk
          file qwant/launcher/build/outputs/apk/debug/launcher-debug.apk
          sha256sum qwant/launcher/build/outputs/apk/debug/launcher-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: QwantSYS-REDMAGIC7-Launcher-0.1.0
          path: qwant/launcher/build/outputs/apk/debug/launcher-debug.apk
          if-no-files-found: error
          retention-days: 30
